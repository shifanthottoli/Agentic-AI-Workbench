name: Agentic AI Workbench - CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md

  pull_request:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# GLOBAL ENVIRONMENT
# ============================================================

env:
  AWS_REGION: eu-north-1

  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
  ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# JOBS
# ============================================================

jobs:

  # ==========================================================
  # 1. TEST
  # ==========================================================

  test:

    name: Run Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Check Python syntax
        run: |
          python -m compileall app.py backend.py


  # ==========================================================
  # 2. BUILD + PUSH DOCKER IMAGE
  # ==========================================================

  build-and-push:

    name: Build and Push Docker Image

    runs-on: ubuntu-latest

    needs: test

    if: github.event_name != 'pull_request'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # AWS LOGIN
      # ------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1


      # ------------------------------------------------------
      # VERIFY AWS
      # ------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ------------------------------------------------------
      # LOGIN TO ECR
      # ------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ------------------------------------------------------
      # CREATE IMAGE URI
      # ------------------------------------------------------

      - name: Generate image metadata

        id: image

        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        run: |

          IMAGE_TAG="${GITHUB_SHA}"

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

          echo "=============================================="
          echo "Docker Image"
          echo "=============================================="
          echo "${IMAGE_URI}"


      # ------------------------------------------------------
      # BUILD DOCKER IMAGE
      # ------------------------------------------------------

      - name: Build Docker image

        run: |

          docker build \
            --tag "${{ steps.image.outputs.uri }}" \
            .


      # ------------------------------------------------------
      # PUSH IMAGE TO ECR
      # ------------------------------------------------------

      - name: Push Docker image

        run: |

          docker push "${{ steps.image.outputs.uri }}"


      # ------------------------------------------------------
      # TAG AS LATEST
      # ------------------------------------------------------

      - name: Tag image as latest

        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        run: |

          docker tag \
            "${{ steps.image.outputs.uri }}" \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          docker push \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"


  # ==========================================================
  # 3. DEPLOY TO ECS
  # ==========================================================

  deploy:

    name: Deploy to Amazon ECS

    runs-on: ubuntu-latest

    needs: build-and-push

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # AWS LOGIN
      # ------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1


      # ------------------------------------------------------
      # VERIFY AWS
      # ------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ------------------------------------------------------
      # LOGIN TO ECR
      # ------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ------------------------------------------------------
      # CREATE IMAGE URI
      # ------------------------------------------------------

      - name: Set image URI

        id: image

        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        run: |

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

          echo "=============================================="
          echo "Deploying Docker Image"
          echo "=============================================="
          echo "${IMAGE_URI}"


      # ------------------------------------------------------
      # RENDER ECS TASK DEFINITION
      # ------------------------------------------------------

      - name: Render ECS task definition

        id: task-def

        uses: aws-actions/amazon-ecs-render-task-definition@v1

        with:

          task-definition: ${{ env.ECS_TASK_DEFINITION }}

          container-name: ${{ env.ECS_CONTAINER_NAME }}

          image: ${{ steps.image.outputs.uri }}


      # ------------------------------------------------------
      # DEPLOY ECS SERVICE
      # ------------------------------------------------------

      - name: Deploy to Amazon ECS

        uses: aws-actions/amazon-ecs-deploy-task-definition@v2

        with:

          task-definition: ${{ steps.task-def.outputs.task-definition }}

          service: ${{ env.ECS_SERVICE }}

          cluster: ${{ env.ECS_CLUSTER }}

          wait-for-service-stability: true

          enable-ecs-managed-tags: true


      # ------------------------------------------------------
      # SUCCESS
      # ------------------------------------------------------

      - name: Deployment successful

        run: |

          echo "=============================================="
          echo "       DEPLOYMENT SUCCESSFUL"
          echo "=============================================="

          echo ""
          echo "Repository : ${GITHUB_REPOSITORY}"
          echo "Commit     : ${GITHUB_SHA}"
          echo "AWS Region : ${AWS_REGION}"
          echo "ECR        : ${ECR_REPOSITORY}"
          echo "ECS Cluster: ${ECS_CLUSTER}"
          echo "ECS Service: ${ECS_SERVICE}"
          echo ""
          echo "Application deployed successfully!"
          echo "=============================================="
          # CI/CD configuration updated
