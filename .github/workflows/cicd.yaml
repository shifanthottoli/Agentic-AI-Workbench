name: Agentic AI Workbench - CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# GLOBAL VARIABLES
# ============================================================

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }}

  CONTAINER_NAME: agentic-ai-workbench
  APP_PORT: 8501


# ============================================================
# JOBS
# ============================================================

jobs:

  # ==========================================================
  # 1. CONTINUOUS INTEGRATION
  # ==========================================================

  continuous-integration:

    name: Continuous Integration

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # Setup Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6

        with:
          python-version: "3.11"


      # ------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ------------------------------------------------------
      # Check Python syntax
      # ------------------------------------------------------

      - name: Lint code
        run: |
          python -m compileall app.py backend.py


      # ------------------------------------------------------
      # Validate project files
      # ------------------------------------------------------

      - name: Validate project files
        run: |

          test -f app.py
          test -f backend.py
          test -f requirements.txt
          test -f Dockerfile

          echo "All required project files are present."


      # ------------------------------------------------------
      # Basic application test
      # ------------------------------------------------------

      - name: Run application test
        run: |

          python -m py_compile app.py
          python -m py_compile backend.py

          echo "Python application checks passed."


  # ==========================================================
  # 2. BUILD AND PUSH DOCKER IMAGE
  # ==========================================================

  build-and-push:

    name: Build and Push Docker Image

    runs-on: ubuntu-latest

    needs: continuous-integration

    if: github.event_name != 'pull_request'

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # Setup Docker Buildx
      # ------------------------------------------------------

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3


      # ------------------------------------------------------
      # Login to Docker Hub
      # ------------------------------------------------------

      - name: Log in to Docker Hub

        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ------------------------------------------------------
      # Build and push Docker image
      # ------------------------------------------------------

      - name: Build and push Docker image

        uses: docker/build-push-action@v6

        with:

          context: .

          push: true

          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:${{ github.sha }}

          cache-from: type=gha

          cache-to: type=gha,mode=max


      # ------------------------------------------------------
      # Show Docker image
      # ------------------------------------------------------

      - name: Show Docker image

        run: |

          echo "=============================================="
          echo "DOCKER IMAGE PUSHED SUCCESSFULLY"
          echo "=============================================="

          echo ""
          echo "Latest image:"
          echo "${DOCKER_USERNAME}/${IMAGE_NAME}:latest"

          echo ""
          echo "Commit image:"
          echo "${DOCKER_USERNAME}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo ""
          echo "Registry:"
          echo "${REGISTRY}"

          echo "=============================================="


  # ==========================================================
  # 3. DEPLOY TO AWS EC2
  #
  # IMPORTANT:
  # This job runs directly on the EC2 machine because
  # the EC2 machine has been configured as a GitHub
  # self-hosted runner.
  # ==========================================================

  deploy-to-ec2:

    name: Deploy to AWS EC2

    runs-on: self-hosted

    needs: build-and-push

    if: github.event_name != 'pull_request'

    steps:

      # ------------------------------------------------------
      # Check EC2 runner
      # ------------------------------------------------------

      - name: Check EC2 runner

        run: |

          echo "=============================================="
          echo "AWS EC2 SELF-HOSTED RUNNER"
          echo "=============================================="

          echo ""
          echo "Hostname:"
          hostname

          echo ""
          echo "Operating System:"
          uname -a

          echo ""
          echo "Docker version:"
          docker --version

          echo "=============================================="


      # ------------------------------------------------------
      # Login to Docker Hub
      # ------------------------------------------------------

      - name: Log in to Docker Hub

        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

        run: |

          echo "$DOCKER_PASSWORD" | docker login \
            --username "$DOCKER_USERNAME" \
            --password-stdin


      # ------------------------------------------------------
      # Validate application secrets
      # ------------------------------------------------------

      - name: Validate application secrets

        env:

          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}

        run: |

          echo "Checking application secrets..."

          test -n "$OPENROUTER_API_KEY"
          test -n "$TAVILY_API_KEY"
          test -n "$ALPHA_VANTAGE_API_KEY"
          test -n "$LANGSMITH_API_KEY"
          test -n "$LANGSMITH_ENDPOINT"
          test -n "$LANGSMITH_PROJECT"
          test -n "$LANGSMITH_TRACING"

          echo "All application secrets are available."


      # ------------------------------------------------------
      # Pull latest Docker image
      # ------------------------------------------------------

      - name: Pull latest Docker image

        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}

        run: |

          IMAGE="${DOCKER_USERNAME}/${IMAGE_NAME}:latest"

          echo "=============================================="
          echo "PULLING LATEST DOCKER IMAGE"
          echo "=============================================="

          echo ""
          echo "Image:"
          echo "$IMAGE"

          docker pull "$IMAGE"


      # ------------------------------------------------------
      # Stop existing container
      # ------------------------------------------------------

      - name: Stop existing container

        run: |

          echo "Stopping existing container..."

          docker stop "$CONTAINER_NAME" 2>/dev/null || true


      # ------------------------------------------------------
      # Remove existing container
      # ------------------------------------------------------

      - name: Remove existing container

        run: |

          echo "Removing existing container..."

          docker rm "$CONTAINER_NAME" 2>/dev/null || true


      # ------------------------------------------------------
      # Run Streamlit container
      # ------------------------------------------------------

      - name: Run Streamlit container

        env:

          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}

          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}

        run: |

          IMAGE="${DOCKER_USERNAME}/${IMAGE_NAME}:latest"

          echo "=============================================="
          echo "STARTING STREAMLIT CONTAINER"
          echo "=============================================="

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p 8501:8501 \
            -e OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            -e TAVILY_API_KEY="$TAVILY_API_KEY" \
            -e ALPHA_VANTAGE_API_KEY="$ALPHA_VANTAGE_API_KEY" \
            -e LANGSMITH_API_KEY="$LANGSMITH_API_KEY" \
            -e LANGSMITH_ENDPOINT="$LANGSMITH_ENDPOINT" \
            -e LANGSMITH_PROJECT="$LANGSMITH_PROJECT" \
            -e LANGSMITH_TRACING="$LANGSMITH_TRACING" \
            "$IMAGE"

          echo ""
          echo "Container started."


      # ------------------------------------------------------
      # Wait for application
      # ------------------------------------------------------

      - name: Wait for application

        run: |

          echo "Waiting for Streamlit to start..."

          sleep 15


      # ------------------------------------------------------
      # Verify container is running
      # ------------------------------------------------------

      - name: Verify container is running

        run: |

          echo "=============================================="
          echo "VERIFYING CONTAINER"
          echo "=============================================="

          if docker ps --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then

            echo ""
            echo "Container is running successfully."

          else

            echo ""
            echo "ERROR: Container is NOT running."

            echo ""
            echo "Container logs:"
            docker logs "$CONTAINER_NAME" || true

            exit 1

          fi


      # ------------------------------------------------------
      # Verify Streamlit health endpoint
      # ------------------------------------------------------

      - name: Verify Streamlit health endpoint

        run: |

          echo "=============================================="
          echo "STREAMLIT HEALTH CHECK"
          echo "=============================================="

          for i in {1..10}; do

            if curl --fail --silent \
              http://localhost:8501/_stcore/health; then

              echo ""
              echo "Streamlit health check PASSED."

              exit 0

            fi

            echo "Waiting for Streamlit..."
            sleep 5

          done

          echo ""
          echo "ERROR: Streamlit health check FAILED."

          echo ""
          echo "Recent application logs:"

          docker logs --tail 100 "$CONTAINER_NAME" || true

          exit 1


      # ------------------------------------------------------
      # Show recent application logs
      # ------------------------------------------------------

      - name: Show recent application logs

        run: |

          echo "=============================================="
          echo "RECENT APPLICATION LOGS"
          echo "=============================================="

          docker logs --tail 30 "$CONTAINER_NAME" || true


      # ------------------------------------------------------
      # Remove unused Docker images
      # ------------------------------------------------------

      - name: Remove unused Docker images

        run: |

          echo "Cleaning unused Docker images..."

          docker image prune -f || true


      # ------------------------------------------------------
      # Deployment successful
      # ------------------------------------------------------

      - name: Deployment successful

        run: |

          echo "=============================================="
          echo "       DEPLOYMENT SUCCESSFUL"
          echo "=============================================="

          echo ""
          echo "Continuous Integration : PASSED"
          echo "Docker Build           : PASSED"
          echo "Docker Hub Push        : PASSED"
          echo "EC2 Deployment         : PASSED"
          echo "Container Check        : PASSED"
          echo "Streamlit Health       : PASSED"

          echo ""
          echo "Container : $CONTAINER_NAME"
          echo "Port      : 8501"
          echo ""

          echo "Your Agentic AI Workbench is running on EC2."
          echo "=============================================="